description:
  en: 'Per-channel credit balances for the Our Free Model gateway in the DSH sidebar: one always-on card listing every channel the gateway supports, collapsed to the channel the current conversation uses, expanded to one row per channel with a bar and remaining amount, with per-channel visibility toggles on the plugin detail page.'
  zh: '在 DSH 侧栏显示 Our Free Model 网关各渠道的剩余额度：一张常驻卡片列出网关支持的全部渠道，折叠时显示当前对话所用渠道及其剩余百分比，展开后每个渠道一行含进度条与余量，并可在插件详情页按渠道开关显示。'